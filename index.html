<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的素材库 · 文件夹分类</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #161616;
      color: #e8e8e8;
      min-height: 100vh;
    }

    /* 顶栏 */
    .header {
      padding: 18px 24px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: #161616;
      z-index: 100;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #f0a030;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header .count {
      font-size: 12px;
      color: #6b6b6b;
    }

    .search {
      flex: 1;
      min-width: 160px;
      max-width: 320px;
      margin-left: auto;
    }

    .search input {
      width: 100%;
      height: 34px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0 12px;
      color: #e8e8e8;
      font-size: 13px;
      outline: none;
    }

    .search input:focus {
      border-color: #f0a030;
    }

    /* 工具栏：新建文件夹 + 管理按钮 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      padding: 12px 24px 8px 24px;
      border-bottom: 1px solid #2a2a2a;
      background: #1a1a1a;
    }

    .toolbar .btn {
      background: #2a2a2a;
      border: none;
      color: #d0d0d0;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .toolbar .btn:hover {
      background: #363636;
      border-color: #555;
      color: #f0f0f0;
    }

    .toolbar .btn-primary {
      background: #f0a030;
      color: #121212;
      font-weight: 500;
    }

    .toolbar .btn-primary:hover {
      background: #e09420;
      border-color: #f0a030;
    }

    .folder-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
      margin-left: 8px;
    }

    .folder-tab {
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 13px;
      background: transparent;
      color: #999;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.15s;
    }

    .folder-tab:hover {
      background: #2a2a2a;
      color: #ddd;
    }

    .folder-tab.active {
      background: #2a2a2a;
      color: #f0a030;
      border-color: #f0a030;
    }

    .folder-tab .badge {
      background: #333;
      color: #aaa;
      border-radius: 30px;
      padding: 0 8px;
      font-size: 11px;
      margin-left: 4px;
    }

    .folder-tab.active .badge {
      background: #f0a030;
      color: #121212;
    }

    /* 主区域 */
    .main {
      padding: 20px 24px 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }

    .card:hover {
      border-color: #f0a030;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }

    .thumb {
      width: 100%;
      aspect-ratio: 1;
      background: #252525;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .card:hover .thumb img {
      transform: scale(1.05);
    }

    .info {
      padding: 9px 11px;
    }

    .name {
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      font-size: 10px;
      color: #6b6b6b;
      margin-top: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .tag {
      padding: 1px 7px;
      background: #252525;
      border-radius: 8px;
      font-size: 10px;
      color: #a0a0a0;
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 40vh;
      color: #6b6b6b;
      gap: 10px;
      grid-column: 1 / -1;
    }

    .empty .hint {
      font-size: 14px;
    }

    /* 灯箱 */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .lightbox.show {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
    }

    .lightbox .close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .lightbox .info {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.9);
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 12px;
      color: #a0a0a0;
      max-width: 80vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 管理弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 28px 32px;
      max-width: 420px;
      width: 90%;
      color: #e8e8e8;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #f0a030;
    }

    .modal label {
      display: block;
      font-size: 13px;
      margin: 10px 0 4px;
      color: #aaa;
    }

    .modal input,
    .modal select {
      width: 100%;
      padding: 8px 12px;
      background: #252525;
      border: 1px solid #444;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 14px;
      outline: none;
    }

    .modal input:focus,
    .modal select:focus {
      border-color: #f0a030;
    }

    .modal .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    .modal .btn-row .btn {
      padding: 8px 20px;
      border-radius: 30px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
    }

    .modal .btn-row .btn-cancel {
      background: #2a2a2a;
      color: #aaa;
    }

    .modal .btn-row .btn-cancel:hover {
      background: #3a3a3a;
    }

    .modal .btn-row .btn-confirm {
      background: #f0a030;
      color: #121212;
      font-weight: 500;
    }

    .modal .btn-row .btn-confirm:hover {
      background: #e09420;
    }

    .modal .folder-list {
      margin: 10px 0 6px;
      max-height: 160px;
      overflow-y: auto;
    }

    .modal .folder-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: #252525;
      border-radius: 6px;
      margin-bottom: 4px;
    }

    .modal .folder-item .del-btn {
      background: transparent;
      border: none;
      color: #a55;
      cursor: pointer;
      font-size: 14px;
    }

    .modal .folder-item .del-btn:hover {
      color: #f55;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
      .header {
        padding: 12px 16px;
      }
      .toolbar {
        padding: 10px 16px 6px;
      }
      .modal {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- ====== 顶栏 ====== -->
  <div class="header">
    <h1>📁 我的素材库</h1>
    <span class="count" id="count"></span>
    <div class="search">
      <input type="text" id="searchInput" placeholder="搜索素材...">
    </div>
  </div>

  <!-- ====== 工具栏 ====== -->
  <div class="toolbar">
    <button class="btn btn-primary" id="newFolderBtn">➕ 新建文件夹</button>
    <button class="btn" id="manageBtn">📂 管理文件夹</button>
    <div class="folder-tabs" id="folderTabs">
      <!-- 由 JS 动态渲染 -->
    </div>
  </div>

  <!-- ====== 主区域 ====== -->
  <div class="main">
    <div class="grid" id="grid"></div>
  </div>

  <!-- ====== 灯箱 ====== -->
  <div class="lightbox" id="lb">
    <button class="close" onclick="closeLb()">&times;</button>
    <img id="lbImg" src="">
    <div class="info" id="lbInfo"></div>
  </div>

  <!-- ====== 管理弹窗 (新建/删除文件夹 + 移动图片) ====== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">📂 管理文件夹</h2>
      <div id="modalBody">
        <!-- 动态内容 -->
      </div>
    </div>
  </div>

  <script>
    // ---------- 数据 ----------
    const DEFAULT_FOLDERS = ['全部', '设计灵感', 'UI界面', '描画素材'];

    // 图片数据 (原始数据，带 folder 字段)
    let rawData = [{
      id: "id_1787984216604_cw7f79tgl",
      name: "da85bb42dae3ca2bca1b15f12d22f9d8a9d16cad7d71f-rKlfZW_fw1200webp",
      url: "https://raw.githubusercontent.com/1318756917-beep/symmetrical-octo-waddle/main/assets/id_1787984216604_cw7f79tgl.webp",
      width: 0,
      height: 0,
      tags: [],
      createdAt: 1787984216961,
      folder: '设计灵感'
    }, {
      id: "id_1787984269702_xi7gmaabb",
      name: "9231ff92354d7d7f8a5a05b40e8e358eff9371241a6ac-gxa1sw_fw1200webp",
      url: "https://raw.githubusercontent.com/1318756917-beep/symmetrical-octo-waddle/main/assets/id_1787984269702_xi7gmaabb.webp",
      width: 0,
      height: 0,
      tags: [],
      createdAt: 1787984271956,
      folder: 'UI界面'
    }, {
      id: "id_1787996498341_b1cucbzri",
      name: "4006f7db1728a581200f688b259b1b9a",
      url: "https://raw.githubusercontent.com/1318756917-beep/symmetrical-octo-waddle/main/assets/id_1787996498341_b1cucbzri.jpg",
      width: 0,
      height: 0,
      tags: [],
      createdAt: 1787996498344,
      folder: '描画素材'
    }, {
      id: "id_1787996513288_ugiwogaai",
      name: "61ba2b358750bfc9fd0c4653ce58dc88",
      url: "https://raw.githubusercontent.com/1318756917-beep/symmetrical-octo-waddle/main/assets/id_1787996513288_ugiwogaai.jpg",
      width: 0,
      height: 0,
      tags: [],
      createdAt: 1787996513294,
      folder: '设计灵感'
    }, {
      id: "id_1787996639277_115gq5ig5",
      name: "3EsrUcDoYpo9ruFyLoaUXYYfwXtkpFBGDG",
      url: "https://raw.githubusercontent.com/1318756917-beep/symmetrical-octo-waddle/main/assets/id_1787996639277_115gq5ig5.jpg",
      width: 0,
      height: 0,
      tags: [],
      createdAt: 1787996639278,
      folder: 'UI界面'
    }, {
      id: "id_1787996644057_gv8fxem02",
      name: "dde819d7f10f4958fc83841adf073707",
      url: "https://raw.githubusercontent.com/1318756917-beep/symmetrical-octo-waddle/main/assets/id_1787996644057_gv8fxem02.jpg",
      width: 0,
      height: 0,
      tags: [],
      createdAt: 1787996644058,
      folder: '描画素材'
    }];

    // 当前选中的文件夹 (默认 '全部')
    let currentFolder = '全部';
    let folderList = [...DEFAULT_FOLDERS]; // 可扩展

    // ---------- DOM 引用 ----------
    const gridEl = document.getElementById('grid');
    const countEl = document.getElementById('count');
    const searchInput = document.getElementById('searchInput');
    const folderTabsEl = document.getElementById('folderTabs');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    // ---------- 渲染函数 ----------
    function render() {
      // 1. 更新文件夹 tabs
      renderTabs();

      // 2. 过滤数据
      const q = searchInput.value.toLowerCase();
      let filtered = rawData.filter(item => {
        // 文件夹过滤
        if (currentFolder !== '全部' && item.folder !== currentFolder) return false;
        // 搜索过滤
        if (q && !item.name.toLowerCase().includes(q) && !(item.tags || []).some(t => t.toLowerCase().includes(q))) {
          return false;
        }
        return true;
      });

      // 3. 渲染网格
      if (filtered.length === 0) {
        gridEl.innerHTML = `<div class="empty"><span class="hint">📭 没有匹配的素材</span><span style="font-size:12px;">尝试切换文件夹或调整搜索词</span></div>`;
      } else {
        gridEl.innerHTML = filtered.map((item, idx) => {
          // 找到在 rawData 中的原始索引，用于打开灯箱
          const realIndex = rawData.indexOf(item);
          return `
            <div class="card" onclick="openLb(${realIndex})">
              <div class="thumb"><img src="${item.url}" alt="${item.name}" loading="lazy"></div>
              <div class="info">
                <div class="name">${item.name}</div>
                <div class="meta">
                  <span>📁 ${item.folder || '未分类'}</span>
                  <span>${new Date(item.createdAt).toLocaleDateString()}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      // 更新计数
      countEl.textContent = `${filtered.length} / ${rawData.length} 张图片`;
    }

    // 渲染文件夹选项卡
    function renderTabs() {
      // 去重 + 保留 '全部' 在第一位
      const folders = ['全部', ...new Set(folderList.filter(f => f !== '全部'))];
      folderTabsEl.innerHTML = folders.map(f => `
        <span class="folder-tab ${f === currentFolder ? 'active' : ''}" data-folder="${f}">
          ${f} <span class="badge">${rawData.filter(item => f === '全部' ? true : item.folder === f).length}</span>
        </span>
      `).join('');

      // 绑定点击切换
      document.querySelectorAll('.folder-tab').forEach(el => {
        el.addEventListener('click', function() {
          currentFolder = this.dataset.folder;
          render();
        });
      });
    }

    // ---------- 灯箱 ----------
    function openLb(index) {
      const item = rawData[index];
      if (!item) return;
      document.getElementById('lbImg').src = item.url;
      document.getElementById('lbInfo').textContent = `${item.name}  📁 ${item.folder || '未分类'}`;
      document.getElementById('lb').classList.add('show');
    }

    function closeLb() {
      document.getElementById('lb').classList.remove('show');
    }
    document.getElementById('lb').addEventListener('click', function(e) {
      if (e.target.id === 'lb') closeLb();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLb();
    });

    // ---------- 搜索 ----------
    searchInput.addEventListener('input', render);

    // ---------- 管理弹窗 (新建文件夹 / 删除文件夹 / 移动图片) ----------
    function openModal(mode) {
      modalOverlay.classList.add('show');
      if (mode === 'new') {
        modalTitle.textContent = '➕ 新建文件夹';
        modalBody.innerHTML = `
          <label>文件夹名称</label>
          <input type="text" id="newFolderInput" placeholder="例如: 插画集" value="">
          <div class="btn-row">
            <button class="btn btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn btn-confirm" id="confirmNewFolder">创建</button>
          </div>
        `;
        document.getElementById('confirmNewFolder').addEventListener('click', function() {
          const name = document.getElementById('newFolderInput').value.trim();
          if (name && !folderList.includes(name) && name !== '全部') {
            folderList.push(name);
            // 给所有未分类的图片？不自动归类，只新建
            closeModal();
            render();
          } else {
            alert('请输入有效且不重复的文件夹名称（不能为“全部”）');
          }
        });
      } else if (mode === 'manage') {
        modalTitle.textContent = '📂 管理文件夹 & 移动图片';
        // 展示所有文件夹 (除了 '全部') 以及每个文件夹下的图片列表
        const folders = folderList.filter(f => f !== '全部');
        let html = `
          <label>当前文件夹列表 (点击 ✖ 删除，仅当文件夹为空)</label>
          <div class="folder-list">
        `;
        folders.forEach(f => {
          const count = rawData.filter(item => item.folder === f).length;
          html += `
            <div class="folder-item">
              <span>📁 ${f} (${count} 张)</span>
              <button class="del-btn" data-folder="${f}" title="删除文件夹 (必须为空)">✖</button>
            </div>
          `;
        });
        html += `</div><hr style="border-color:#333;margin:10px 0;">`;

        // 移动图片到其他文件夹
        html += `<label>将选中的图片移动到文件夹</label>`;
        html += `<select id="moveSelectFolder">`;
        const allFolders = ['全部', ...folderList.filter(f => f !== '全部')];
        allFolders.forEach(f => {
          html += `<option value="${f}">${f}</option>`;
        });
        html += `</select>`;

        // 图片选择列表 (只显示当前筛选后的图片，方便操作)
        const currentItems = rawData.filter(item => currentFolder === '全部' ? true : item.folder === currentFolder);
        html += `<label>选择图片 (当前视图)</label>`;
        html += `<div style="max-height:120px;overflow-y:auto;background:#252525;border-radius:8px;padding:4px;">`;
        currentItems.forEach((item, idx) => {
          const realIdx = rawData.indexOf(item);
          html += `
            <div style="display:flex;align-items:center;gap:6px;padding:3px 6px;border-bottom:1px solid #2a2a2a;">
              <input type="checkbox" class="move-check" value="${realIdx}" id="chk_${realIdx}">
              <label for="chk_${realIdx}" style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.name}</label>
              <span style="font-size:10px;color:#777;">📁 ${item.folder}</span>
            </div>
          `;
        });
        html += `</div>`;

        html += `
          <div class="btn-row">
            <button class="btn btn-cancel" onclick="closeModal()">关闭</button>
            <button class="btn btn-confirm" id="moveSelectedBtn">移动选中图片</button>
          </div>
        `;

        modalBody.innerHTML = html;

        // 删除文件夹事件
        document.querySelectorAll('.del-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const folderName = this.dataset.folder;
            const count = rawData.filter(item => item.folder === folderName).length;
            if (count > 0) {
              alert(`文件夹 "${folderName}" 不为空 (包含 ${count} 张图片)，请先移走图片。`);
              return;
            }
            if (confirm(`确定删除空文件夹 "${folderName}" 吗？`)) {
              folderList = folderList.filter(f => f !== folderName);
              if (currentFolder === folderName) currentFolder = '全部';
              closeModal();
              render();
            }
          });
        });

        // 移动选中图片
        document.getElementById('moveSelectedBtn').addEventListener('click', function() {
          const targetFolder = document.getElementById('moveSelectFolder').value;
          if (!targetFolder || targetFolder === '全部') {
            alert('请选择有效的目标文件夹 (不能为 "全部")');
            return;
          }
          const checkboxes = document.querySelectorAll('.move-check:checked');
          if (checkboxes.length === 0) {
            alert('请至少选择一张图片');
            return;
          }
          let moved = 0;
          checkboxes.forEach(cb => {
            const idx = parseInt(cb.value);
            if (!isNaN(idx) && rawData[idx]) {
              rawData[idx].folder = targetFolder;
              moved++;
            }
          });
          if (moved > 0) {
            // 如果目标文件夹不在 folderList 中，自动添加
            if (!folderList.includes(targetFolder)) {
              folderList.push(targetFolder);
            }
            closeModal();
            render();
          } else {
            alert('移动失败，请重试');
          }
        });
      }
    }

    function closeModal() {
      modalOverlay.classList.remove('show');
    }

    // 点击外部关闭
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) closeModal();
    });

    // ---------- 按钮绑定 ----------
    document.getElementById('newFolderBtn').addEventListener('click', () => openModal('new'));
    document.getElementById('manageBtn').addEventListener('click', () => openModal('manage'));

    // ---------- 初始化 ----------
    render();

    // 暴露给全局 (用于 onclick)
    window.openLb = openLb;
    window.closeLb = closeLb;
    window.closeModal = closeModal;
  </script>

</body>
</html>
